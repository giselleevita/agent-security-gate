name: Benchmark Snapshot Artifact

on:
  push:
    branches: [main]
    paths:
      - "benchmark/**"
      - "ci/thresholds.yaml"
      - "scripts/publish_benchmark_results.py"
      - ".github/workflows/publish-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.19.1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --constraint requirements-dev.lock -e '.[dev]'
      - name: Run benchmark comparison
        run: |
          python -m benchmark.runner \
            --scenarios benchmark/scenarios/scenarios.yaml \
            --baseline compare \
            --runs 5 \
            --summary results/summary.json \
            --comparison results/comparison.json \
            --report results/benchmark-report.md
      - name: Publish docs snapshot
        run: python scripts/publish_benchmark_results.py
      - name: Upload benchmark snapshot artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results-snapshot
          path: docs/benchmark-results/
